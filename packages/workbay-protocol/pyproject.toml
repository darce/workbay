[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "workbay-protocol"
version = "0.3.29"
description = "Typed cross-repo contracts for the WorkBay system: handoff state, MCP I/O, hook events, skill manifests, bootstrap install manifest."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/darce/workbay"
Source = "https://github.com/darce/workbay/tree/main/packages/workbay-protocol"
Documentation = "https://github.com/darce/workbay/blob/main/docs/CONSUMER.md"
Changelog = "https://github.com/darce/workbay/blob/main/packages/workbay-protocol/CHANGELOG.md"
Issues = "https://github.com/darce/workbay/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "jsonschema>=4.0.0",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

# Scrub-at-build shape: only-include the remapped IMPORT name (not src/<pkg>) so
# hatchling ships nothing raw and the hook's scrubbed force-include is the sole
# copy. Avoids shipping the unscrubbed src/ tree alongside it (REVB-01); keeps the
# wheel-from-sdist rebuild working (the hook resolves the name to the sdist's
# top-level <pkg> dir when src/<pkg> is absent).
[tool.hatch.build.targets.wheel]
only-include = ["workbay_protocol"]

[tool.hatch.build.targets.sdist]
only-include = ["workbay_protocol", "schemas", "hatch_build.py", "_scrub_core.py"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
# Drop a passing test's tmp_path scratch at teardown. The default "all" keeps
# every run's scratch until a GC that fires only at the START of a later run,
# so it outlives its use by days; failing tests' scratch is still retained.
tmp_path_retention_policy = "failed"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
follow_imports = "silent"

# Current diagnostics in legacy modules. Other diagnostics stay enabled.

[[tool.mypy.overrides]]
module = ["workbay_protocol.bootstrap"]
disable_error_code = ["arg-type", "return-value"]

[[tool.mypy.overrides]]
module = ["workbay_protocol.canon_lint", "workbay_protocol.embedding_policy", "workbay_protocol.resource_lifecycle"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["workbay_protocol.convergence"]
disable_error_code = ["misc", "no-any-return", "unused-ignore"]
