name: plan-draft
scope: harness
description: Use for pre-review triage of planning documents. Triggers on `/wb-draft`
  and `make plan-analyze`, and on requests to scan a plan for ambiguity, duplication,
  or missing coverage before formal planning review.
mode: advisory
context_budget: 200
makefile_target: plan-analyze
mcp_tools:
- review_findings
- review_runs
tdd_gate: false
generator:
  claude_overrides:
    disable-model-invocation: false
