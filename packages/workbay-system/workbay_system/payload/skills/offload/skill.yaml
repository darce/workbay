name: offload
scope: harness
description: One-command bounded cross-harness offload (grok-remote, grok-cli,
  codex-subagent, codex-remote, cursor-cli, cursor-remote, or openrouter-remote) with explicit
  --agent/--effort, caller-owned token
  budget, and a review gate; remote_only installs (--with-remote) require an explicit remote
  backend and flag remote_required when a local backend is requested, instead of substituting it.
  Triggers on `/wb-offload` and operator requests to dispatch a self-contained slice to
  a junior lane. No implicit fallback; an operator-authorised, capacity-only fallback is
  permitted, the coordinator records it by hand, and it is not yet engine-enforced.
mode: execution
context_budget: 120
makefile_target: null
mcp_tools:
- get_handoff_state
- offload_preflight
- materialize_offload_lane_manifest
- manage_worktree_lane
- dispatch_lane_work
- semantic_reinjection_packet
- run_offload_pass
- await_offload_pass
- continuation
- list_available_backends
- turn_metrics
- load_session
tdd_gate: false
generator:
  claude_overrides:
    disable-model-invocation: false