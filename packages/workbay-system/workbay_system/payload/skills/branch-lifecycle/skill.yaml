name: branch-lifecycle
scope: harness
description: Use for isolated task branches, independent lane frontiers, exact-tip
  landing, and canonical task cleanup. Triggers on `make task-start`, `make review-ready`,
  `make handoff-close-check`, or `make task-finish`.
mode: execution
context_budget: 150
makefile_target: task-start
mcp_tools:
- set_handoff_state
- get_handoff_state
- record_event
- close_slice
- integrity_check
- switch_task
- load_session
tdd_gate: true
generator:
  claude_overrides:
    disable-model-invocation: false
