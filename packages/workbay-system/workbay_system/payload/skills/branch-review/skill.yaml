name: branch-review
scope: harness
description: Use for exact-candidate branch review and individually verified finding
  closure. Triggers on `make review-run` for lane/local working-tree review, branch
  diff review requests, or pre-merge audit passes.
mode: execution
context_budget: 150
makefile_target: review-run
mcp_tools:
- get_review_findings_summary
- reconcile_review_findings
- review_findings
- review_runs
- record_event
- set_handoff_state
- search_handoff
- integrity_check
- get_verified_tests
- load_session
tdd_gate: false
generator:
  claude_overrides:
    disable-model-invocation: false
