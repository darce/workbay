[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "workbay-canon-lint"
version = "0.1.1"
description = "Deterministic WorkBay checks against a pinned heuristics canon"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.10,<3",
    "workbay-protocol>=0.3.29,<1",
]

[project.entry-points."workbay.commands"]
canon = "workbay_canon_lint.cli:canon_main"


[tool.hatch.build.targets.wheel]
packages = ["src/workbay_canon_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
